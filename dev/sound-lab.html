<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sound lab</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #1b1f3b;
        --panel: #262b52;
        --line: #3a4078;
        --text: #f4f1ff;
        --dim: #a9a6c9;
        --accent: #ffcc33;
        --blue: #6fd3ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.4 'Segoe UI', system-ui, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 12px 18px;
        background: #14172e;
        border-bottom: 2px solid var(--line);
      }
      header h1 { font-size: 20px; margin: 0 12px 0 0; }
      #status { color: var(--dim); margin-left: auto; }
      main { padding: 14px 18px 60px; display: grid; gap: 14px; }
      button {
        font: inherit;
        font-weight: 600;
        color: #1b1f3b;
        background: var(--accent);
        border: 0;
        border-radius: 10px;
        padding: 9px 14px;
        min-height: 40px;
        cursor: pointer;
      }
      button.secondary { background: var(--blue); }
      button.ghost { background: transparent; color: var(--text); border: 2px solid var(--line); }
      button.variant { background: #3a4078; color: var(--text); min-width: 52px; }
      button.variant.selected { background: var(--blue); color: #1b1f3b; }
      button:active { transform: translateY(1px); }
      .row {
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        display: grid;
        gap: 10px;
      }
      .row-head, .variants { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .name { font-size: 18px; font-weight: 700; min-width: 110px; }
      .stars button { background: transparent; color: #6b6a8f; font-size: 24px; padding: 0 4px; min-height: 36px; }
      .stars button.on { color: var(--accent); }
      .notes { flex: 1 1 220px; min-width: 180px; font: inherit; padding: 8px 10px; border-radius: 8px; border: 2px solid var(--line); background: #1b1f3b; color: var(--text); }
      .chosen { color: var(--dim); }
      .sliders { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 8px 24px; }
      .slider { display: grid; grid-template-columns: 84px 1fr 66px; gap: 8px; align-items: center; }
      .slider.unused { opacity: 0.35; }
      .slider input { width: 100%; accent-color: var(--accent); }
      .slider .value { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
      .hint { color: var(--dim); font-size: 13px; margin: 0; }
      .round2 { margin: 0; color: var(--accent); font-size: 13px; }
      input[type='file'] { display: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>Sound lab</h1>
      <button id="play-all">Play all</button>
      <button id="gameplay">Play 20 s of gameplay</button>
      <button id="mute" class="ghost">Mute</button>
      <button id="export" class="secondary">Export</button>
      <button id="import" class="ghost">Import</button>
      <button id="owner" class="ghost">Load owner ratings</button>
      <input id="import-file" type="file" accept="application/json,.json" />
      <span id="status">Click anything to turn sound on.</span>
    </header>
    <main id="rows"></main>
    <script type="module" src="/src/dev/sound-lab.ts"></script>
  </body>
</html>
